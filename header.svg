<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Osama Bin Al Kafi, Flutter Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.05"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="240" rx="16"/></clipPath>
  </defs>
  <style>
    .title { font: 700 46px 'Segoe UI', Helvetica, Arial, sans-serif; fill: url(#accent); animation: rise 1.1s ease-out both; }
    .sub   { font: 500 18px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; animation: rise 1.1s ease-out .5s both; }
    .tag   { font: 500 14px 'Courier New', monospace; fill: #8b949e; animation: rise 1.1s ease-out 1s both; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .w1 { animation: slide 9s linear infinite; }
    .w2 { animation: slide 14s linear infinite reverse; }
    .dot { animation: float 5s ease-in-out infinite; }
    .d2 { animation-delay: -1.5s; } .d3 { animation-delay: -3s; } .d4 { animation-delay: -4s; }
    @keyframes rise  { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-900px); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="900" height="240" fill="url(#bg)"/>
    <g class="w2"><path d="M0 175 Q112.5 145 225 175 T450 175 T675 175 T900 175 T1125 175 T1350 175 T1575 175 T1800 175 V240 H0 Z" fill="url(#wave2)"/></g>
    <g class="w1"><path d="M0 195 Q112.5 165 225 195 T450 195 T675 195 T900 195 T1125 195 T1350 195 T1575 195 T1800 195 V240 H0 Z" fill="url(#wave1)"/></g>
    <circle class="dot" cx="760" cy="60" r="5" fill="#22d3ee" opacity=".7"/>
    <circle class="dot d2" cx="820" cy="110" r="3" fill="#a78bfa" opacity=".8"/>
    <circle class="dot d3" cx="700" cy="120" r="4" fill="#a78bfa" opacity=".6"/>
    <circle class="dot d4" cx="860" cy="50" r="3" fill="#22d3ee" opacity=".8"/>
    <text class="title" x="450" y="100" text-anchor="middle">Osama Bin Al Kafi</text>
    <text class="sub" x="450" y="138" text-anchor="middle">Flutter Developer  |  Web Developer  |  Digital Marketer</text>
    <text class="tag" x="450" y="168" text-anchor="middle">&gt; building modern apps with the help of AI<tspan class="cursor">_</tspan></text>
  </g>
  <rect x="0.5" y="0.5" width="899" height="239" rx="16" fill="none" stroke="#30363d"/>
</svg>
